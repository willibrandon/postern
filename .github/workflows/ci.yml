name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OTP_VERSION: "28.5.0.6"
  ELIXIR_VERSION: "1.20.4"
  ZIG_VERSION: "0.16.0"
  NODE_VERSION: "24"

jobs:
  server:
    name: Server (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: [13, 14, 15, 16, 17, 18]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          version-type: strict
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test
      # The modules that define their settings only when preloaded are
      # preloaded, so that the server checks their values as the catalogs do.
      - name: Start PostgreSQL
        run: |
          docker run -d --name postgres -e POSTGRES_HOST_AUTH_METHOD=trust -p 5432:5432 \
            postgres:${{ matrix.postgres }} -c shared_preload_libraries=pg_stat_statements,pg_prewarm,auto_explain
          for i in $(seq 1 30); do docker exec postgres pg_isready -U postgres && break; sleep 1; done
      - name: Compare the checks with the server, value by value and line by line
        run: mix test --only live
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
      - run: mix credo --strict
      - run: mix format --check-formatted

  suite:
    name: Suite on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          version-type: strict
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test

  binary:
    name: Linux binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          version-type: strict
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: sudo apt-get install -y --no-install-recommends xz-utils
      - run: MIX_ENV=prod mix deps.get
      - run: BURRITO_TARGET=linux_x86_64 MIX_ENV=prod mix release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postern-linux-x64
          path: burrito_out/postern_linux_x86_64
          if-no-files-found: error

  # The action in action.yml, run on the binary the job above built, once on
  # a file the server accepts and once on a file it refuses.
  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: binary
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: postern-linux-x64
          path: artifacts
      - run: chmod 755 artifacts/postern_linux_x86_64
      - name: Check a file the server accepts
        uses: ./
        with:
          path: artifacts/postern_linux_x86_64
          files: test/fixtures/pg_hba.conf
      - name: Check a file the server refuses
        id: refused
        continue-on-error: true
        uses: ./
        with:
          path: artifacts/postern_linux_x86_64
          files: editors/vscode/test/fixtures/postgresql.conf
          pg: "17"
      - name: Expect the refused check to fail
        env:
          OUTCOME: ${{ steps.refused.outcome }}
        run: test "$OUTCOME" = failure

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: binary
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run verify
      - name: Start PostgreSQL
        run: |
          docker run -d --name postgres -e POSTGRES_HOST_AUTH_METHOD=trust -p 5432:5432 postgres:17
          for i in $(seq 1 30); do docker exec postgres pg_isready -U postgres && break; sleep 1; done
          { echo "PGHOST=127.0.0.1"; echo "PGPORT=5432"; echo "PGUSER=postgres"; } >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: postern-linux-x64
          path: editors/vscode/server
      - run: mv server/postern_linux_x86_64 server/postern && chmod 755 server/postern
      - name: Exercise the binary over stdio
        run: |
          set +e
          ./server/postern check test/fixtures/postgresql.conf
          code=$?
          set -e
          test "$code" -eq 1 || { echo "postern check exited with $code, expected 1" >&2; exit 1; }
          python3 ../../test/stdio_smoke.py ./server/postern
      - run: xvfb-run -a npm test
      - run: npm run package

  neovim:
    name: Neovim plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: binary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The harness builds Lua from source for busted and needs the readline headers.
      - run: sudo apt-get install -y --no-install-recommends libreadline-dev unzip
      - name: Install Neovim
        run: |
          curl -sSL -o "$RUNNER_TEMP/nvim.tar.gz" https://github.com/neovim/neovim/releases/download/v0.11.5/nvim-linux-x86_64.tar.gz
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: postern-linux-x64
          path: artifacts/binaries
      - run: chmod 755 artifacts/binaries/postern_linux_x86_64
      - name: Build the tree-sitter parser
        run: |
          git clone --depth 1 https://github.com/willibrandon/tree-sitter-postgresql-conf "$RUNNER_TEMP/grammar"
          cc -shared -fPIC -I"$RUNNER_TEMP/grammar/src" "$RUNNER_TEMP/grammar/src/parser.c" -o "$RUNNER_TEMP/postgresql_conf.so"
      - name: Run the busted specs
        working-directory: editors/nvim
        env:
          POSTERN_BIN: ${{ github.workspace }}/artifacts/binaries/postern_linux_x86_64
          POSTERN_PARSER: ${{ runner.temp }}/postgresql_conf.so
        run: nvim -l tests/minit.lua --busted

  fresh:
    name: Fresh bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm install --global @fresh-editor/fresh-editor@0.4.10
      - run: npm ci
        working-directory: editors/fresh
      - run: npm run validate
        working-directory: editors/fresh
      - run: npm run check-types
        working-directory: editors/fresh

  queries:
    name: Editor queries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git clone --depth 1 https://github.com/willibrandon/tree-sitter-postgresql-conf "$RUNNER_TEMP/grammar"
      - name: Check every query file against the grammar
        working-directory: ${{ runner.temp }}/grammar
        run: |
          for query in "$GITHUB_WORKSPACE"/editors/nvim/queries/postgresql_conf/*.scm \
                       "$GITHUB_WORKSPACE"/editors/helix/queries/postgresql-conf/*.scm \
                       "$GITHUB_WORKSPACE"/editors/zed/languages/postgresql_conf/*.scm; do
            echo "$query"
            npx --yes tree-sitter-cli query "$query" "$GITHUB_WORKSPACE"/test/fixtures/pg_hba.conf --quiet
          done

  zed:
    name: Zed extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add wasm32-wasip2
      - run: cargo build --release --target wasm32-wasip2
        working-directory: editors/zed

  emacs:
    name: Emacs mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get install -y --no-install-recommends emacs-nox
      - name: Build the tree-sitter parser
        run: |
          git clone --depth 1 https://github.com/willibrandon/tree-sitter-postgresql-conf "$RUNNER_TEMP/grammar"
          mkdir -p "$RUNNER_TEMP/parser"
          cc -shared -fPIC -I"$RUNNER_TEMP/grammar/src" "$RUNNER_TEMP/grammar/src/parser.c" -o "$RUNNER_TEMP/parser/libtree-sitter-postgresql-conf.so"
      - name: Byte-compile without warnings
        working-directory: editors/emacs
        run: emacs -Q --batch -L . --eval '(setq byte-compile-error-on-warn t)' -f batch-byte-compile postgresql-conf-ts-mode.el
      - name: Run the tests
        working-directory: editors/emacs
        env:
          POSTERN_PARSER_DIR: ${{ runner.temp }}/parser
        run: emacs -Q --batch -L . -l tests/postgresql-conf-ts-mode-test.el -f ert-run-tests-batch-and-exit
